<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Live Monitoring - ExamSecure</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link
        rel="stylesheet"
        href="/teacher-dashboard.css"
    >

    <style>

        .live-monitor-page {
            padding: 30px;
        }

        .live-monitor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .live-monitor-header h1 {
            margin: 0;
        }

        .live-monitor-header p {
            margin: 7px 0 0;
            opacity: 0.75;
        }

        .live-exam-grid {
            display: grid;
            grid-template-columns:
                repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .live-exam-card {
            padding: 24px;
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.10);
        }

        .live-exam-card h2 {
            margin: 12px 0 8px;
        }

        .live-exam-meta {
            display: grid;
            grid-template-columns:
                repeat(2, 1fr);
            gap: 12px;
            margin: 18px 0;
        }

        .live-exam-meta div {
            padding: 12px;
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
        }

        .live-exam-meta span {
            display: block;
            font-size: 12px;
            opacity: 0.65;
            margin-bottom: 4px;
        }

        .monitor-exam-button {
            width: 100%;
            border: 0;
            border-radius: 12px;
            padding: 13px 18px;
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
        }

        .monitor-exam-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .live-exam-status {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
        }

        .live-exam-status.live {
            background: rgba(0, 200, 120, 0.15);
        }

        .live-exam-status.upcoming {
            background: rgba(255, 190, 70, 0.15);
        }

        .live-exam-status.completed {
            background: rgba(130, 140, 160, 0.15);
        }

        .live-exam-status.draft {
            background: rgba(180, 180, 180, 0.15);
        }

        .live-empty {
            padding: 60px 20px;
            text-align: center;
            opacity: 0.75;
        }

        @media (max-width: 700px) {

            .live-monitor-page {
                padding: 18px;
            }

            .live-monitor-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .live-exam-grid {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>

    <main class="live-monitor-page">

        <div class="live-monitor-header">

            <div>

                <h1>
                    Live Monitoring
                </h1>

                <p>
                    Select an exam to monitor students in real time.
                </p>

            </div>

            <button
                type="button"
                class="secondary-action"
                onclick="window.location.href='/teacher-dashboard.html'"
            >
                <i class="fa-solid fa-arrow-left"></i>
                Teacher Dashboard
            </button>

        </div>


        <section
            id="liveExamGrid"
            class="live-exam-grid"
        >

            <div class="live-empty">
                Loading exams...
            </div>

        </section>

    </main>


    <script>

        function escapeHtml(value) {

            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        function getExamState(exam) {

            const now =
                Date.now();

            const start =
                exam.scheduledAt
                    ? new Date(exam.scheduledAt).getTime()
                    : NaN;

            const end =
                exam.sessionEndsAt
                    ? new Date(exam.sessionEndsAt).getTime()
                    : NaN;


            if (exam.status !== "published") {

                return {
                    text: "DRAFT",
                    className: "draft",
                    canMonitor: false
                };

            }


            if (
                Number.isFinite(start) &&
                Number.isFinite(end) &&
                now >= start &&
                now <= end
            ) {

                return {
                    text: "LIVE NOW",
                    className: "live",
                    canMonitor: true
                };

            }


            if (
                Number.isFinite(start) &&
                now < start
            ) {

                return {
                    text: "UPCOMING",
                    className: "upcoming",
                    canMonitor: false
                };

            }


            return {
                text: "COMPLETED",
                className: "completed",
                canMonitor: false
            };

        }


        function openExamMonitor(examId) {

            window.location.href =
                `/live-monitor.html?examId=${encodeURIComponent(examId)}`;

        }


        async function loadLiveMonitoringExams() {

            const grid =
                document.getElementById("liveExamGrid");


            try {

                const response =
                    await fetch(
                        "/api/teacher/exams",
                        {
                            credentials: "include"
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "Could not load teacher exams."
                    );

                }


                const data =
                    await response.json();


                const exams =
                    data.exams || [];


                if (!exams.length) {

                    grid.innerHTML = `
                        <div class="live-empty">
                            <i class="fa-solid fa-video-slash"></i>

                            <h2>
                                No exams created yet
                            </h2>

                            <p>
                                Create an exam first.
                            </p>
                        </div>
                    `;

                    return;

                }


                grid.innerHTML =
                    exams.map(exam => {

                        const state =
                            getExamState(exam);


                        const scheduled =
                            exam.scheduledAt
                                ? new Date(
                                    exam.scheduledAt
                                ).toLocaleString()
                                : "Not scheduled";


                        const sessionEnd =
                            exam.sessionEndsAt
                                ? new Date(
                                    exam.sessionEndsAt
                                ).toLocaleString()
                                : "Not available";


                        return `

                            <article class="live-exam-card">

                                <span
                                    class="
                                        live-exam-status
                                        ${state.className}
                                    "
                                >
                                    ${state.text}
                                </span>


                                <h2>
                                    ${escapeHtml(
                                        exam.title || "Untitled Exam"
                                    )}
                                </h2>


                                <p>
                                    ${escapeHtml(
                                        exam.subject || ""
                                    )}
                                </p>


                                <div class="live-exam-meta">

                                    <div>
                                        <span>Exam Code</span>
                                        <strong>
                                            ${escapeHtml(
                                                exam.code || "-"
                                            )}
                                        </strong>
                                    </div>

                                    <div>
                                        <span>Questions</span>
                                        <strong>
                                            ${exam.questionCount || 0}
                                        </strong>
                                    </div>

                                    <div>
                                        <span>Marks</span>
                                        <strong>
                                            ${exam.totalMarks || 0}
                                        </strong>
                                    </div>

                                    <div>
                                        <span>Duration</span>
                                        <strong>
                                            ${exam.duration || 0} min
                                        </strong>
                                    </div>

                                </div>


                                <p>
                                    <strong>Starts:</strong>
                                    ${escapeHtml(scheduled)}
                                </p>


                                <p>
                                    <strong>Ends:</strong>
                                    ${escapeHtml(sessionEnd)}
                                </p>


                                <button
                                    type="button"
                                    class="monitor-exam-button secondary-action"
                                    ${state.canMonitor ? "" : "disabled"}
                                    onclick="
                                        openExamMonitor(
                                            '${exam.id}'
                                        )
                                    "
                                >

                                    <i class="fa-solid fa-video"></i>

                                    ${state.canMonitor
                                        ? "Monitor Exam"
                                        : "Monitoring Unavailable"
                                    }

                                </button>

                            </article>

                        `;

                    }).join("");


            } catch (error) {

                console.error(
                    "Live monitoring exams error:",
                    error
                );


                grid.innerHTML = `

                    <div class="live-empty">

                        <h2>
                            Could not load exams
                        </h2>

                        <p>
                            ${escapeHtml(error.message)}
                        </p>

                    </div>

                `;

            }

        }


        document.addEventListener(
            "DOMContentLoaded",
            loadLiveMonitoringExams
        );


        setInterval(
            loadLiveMonitoringExams,
            5000
        );

    </script>

</body>

</html>
