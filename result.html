<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ExamSecure | Result</title>
<link rel="stylesheet" href="result.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
<header class="result-topbar"><div class="result-brand"><div class="brand-icon"><i class="fa-solid fa-shield-halved"></i></div><strong>Exam<span>Secure</span></strong></div><button onclick="goDashboard()">Dashboard</button></header>
<main class="result-page"><section class="result-card"><div class="result-icon"><i class="fa-solid fa-check"></i></div><span class="eyebrow">EXAM RESULT</span><h1 id="resultTitle">Result</h1><p id="resultSubtitle">Loading result...</p><div class="score-main"><strong id="resultPercentage">0%</strong><span id="resultScore">0/0</span></div><div class="result-grid"><div><span>Correct</span><strong id="resultCorrect">0</strong></div><div><span>Incorrect</span><strong id="resultIncorrect">0</strong></div><div><span>Submitted</span><strong id="resultSubmitted">-</strong></div><div><span>Status</span><strong>Completed</strong></div></div><p id="autoSubmitNote" class="auto-note"></p><div class="result-actions"><button onclick="goDashboard()">Back to Dashboard</button></div></section></main><script src="result.js"></script>
</body></html>
